name: npm publish (@mboworks/coderef wrapper)

# Publishes the npm wrapper (@mboworks/coderef) to https://registry.npmjs.org.
# The wrapper itself doesn't ship a binary — its postinstall script
# downloads the matching tarball from the corresponding GitHub
# Release. So this channel depends on Channel 1 (release.yml)
# completing first, otherwise `npm install -g @mboworks/coderef@<X>`
# 404s during postinstall.
#
# Triggers:
#   - `workflow_call { tag }` — release.yml invokes this only after the
#     GitHub Release and all of its assets exist.
#   - `workflow_dispatch { tag }` — ad-hoc / retro-publish. Useful
#     for the very first run on a tag that pre-dates this workflow,
#     and for re-runs after a transient registry failure.
#
# NB: we previously had `release: types: [published]` here, the
# natural-looking trigger, but GitHub Actions deliberately
# suppresses workflows triggered by events caused by another
# workflow's `GITHUB_TOKEN` (anti-recursion). release.yml's
# `gh release create` call thus never fired this workflow — see
# `feedback_github_token_no_downstream_workflows` for the saga.
#
# Required repo secret: NPM_TOKEN — a Granular Access Token from
# npmjs.com with `Read and write` permission on the `@mboworks`
# scope, and 2FA "Auth Only" mode on the publisher account so the
# token bypasses interactive OTP. See docs/release.md §2.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish (for example v0.6.0)."
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.3). The GitHub Release for this tag must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish @mboworks/coderef
    runs-on: ubuntu-latest
    steps:
      # Fail fast if the secret isn't configured.
      - name: Verify NPM_TOKEN secret is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repo secret is not set. Add it at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            echo "::error::No tag supplied"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: $tag"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The normal path is ordered by release.yml. Keep an explicit
      # assertion here so a manual retry cannot publish a wrapper whose
      # install-time assets are absent.
      - name: Verify GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$assets" -ne 8 ]; then
            echo "::error::GitHub Release $TAG has $assets assets; expected 8"
            exit 1
          fi
          echo "GitHub Release $TAG has all $assets expected assets"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # registry-url makes setup-node write a project-local
          # .npmrc that reads NODE_AUTH_TOKEN at publish time.
          registry-url: 'https://registry.npmjs.org/'

      - name: npm publish
        working-directory: npm/coderef
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify package on npm registry
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # The registry can take a few seconds to surface a fresh
        # publish on its read-side. Poll briefly.
        run: |
          expected="${TAG#v}"
          for i in 1 2 3 4 5; do
            actual=$(npm view @mboworks/coderef version 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              echo "@mboworks/coderef@$actual is live"
              exit 0
            fi
            echo "  attempt $i: registry shows '$actual', want '$expected' — retrying"
            sleep 5
          done
          echo "::warning::registry didn't surface expected version within 25s; check https://www.npmjs.com/package/@mboworks/coderef"
